# Repo checkout on the managed machine (default: the checkout these playbooks live in)
repo_dir: "{{ playbook_dir | dirname }}"

# Non-root user who will run docker/minikube/kubectl
target_user: "{{ ansible_user | default(lookup('env', 'USER')) }}"

# Docker/kubectl/minikube download names use amd64/arm64
k8s_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

# Minikube cluster size (Minikube's own defaults are 2 CPUs / 2 GB)
minikube_cpus: 2
minikube_memory: 4096   # MB
