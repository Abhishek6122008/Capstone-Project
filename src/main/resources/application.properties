spring.application.name=taskmanager

# Every value below can be overridden by an env var, so the same jar runs locally,
# in Docker Compose and in Kubernetes (ConfigMap/Secret) without rebuilding.
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${DB_USERNAME:taskuser}
spring.datasource.password=${DB_PASSWORD:taskpass}

# ponytail: Hibernate creates/updates tables itself; switch to Flyway once schema changes need versioned migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# 404 / 400 validation errors come back as RFC 7807 JSON
spring.mvc.problemdetails.enabled=true
